[package]
name = "dlt-viewer-iced-app"
version = "0.1.0"
edition = "2024"

[dependencies]
iced = { version = "0.13.1", features = ["canvas", "tokio"] }
tokio = { version = "1", features = ["net", "time", "io-util", "rt-multi-thread"] }
rand = "0.9.2"
iced_aw = "0.12.0"
chrono = "0.4"
dlt_format_parser = { path = "./crate/dlt-format-parser" }
futures = "0.3.31"
regex = "1.12.2"
