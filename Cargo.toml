[package]
name = "dlt-viewer-iced-app"
version = "0.1.0"
edition = "2024"

[dependencies]
iced = { version = "0.14.0", features = ["canvas", "tokio", "lazy", "wgpu", "advanced"] }
tokio = { version = "1.48.0", features = ["net", "time", "io-util", "rt-multi-thread", "sync", "macros"] }
rand = "0.9.2"
iced_aw = "0.13.0"
chrono = "0.4"
dlt-protocol = { path = "./crate/dlt-protocol" }
futures = "0.3.31"
regex = "1.12.2"
serde = { version = "1.0.228", features = ["derive"] }
bincode = "2.0.1"
byteorder = "1.5"

[build-dependencies]
regex = "1.12.2"


[features]
plugin_example = []
